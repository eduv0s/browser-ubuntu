<!DOCTYPE html>
<html>
<head>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .button-container {
            text-align: center;
        }

        .launch-button {
            background: transparent;
            color: white;
            font-size: 28px;
            font-weight: 400;
            padding: 30px 100px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .launch-button:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .launch-button:active {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="button-container">
        <button class="launch-button" onclick="launchGoogle()">Click Here</button>
    </div>

    <script>
    function launchGoogle() {
        // 1. Open the blank tab
        var win = window.open('about:blank', '_blank');

        // 2. The magic URL that allows embedding (?igu=1)
        var url = "https://marvelous-malabi-5129ca.netlify.app/";

        // 3. Inject the iframe and styles
        win.document.write(`
            <style>
                body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
                iframe { width: 100vw; height: 100vh; border: none; }
            </style>
            <iframe src="${url}"></iframe>
        `);
    }
    </script>
</body>
</html>
